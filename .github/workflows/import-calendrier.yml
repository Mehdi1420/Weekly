name: Import calendrier

# Télécharge le calendrier Moodle (et éventuellement l'emploi du temps) et le dépose
# dans le gist secret que l'app lit à chaque ouverture.
# Secrets : MOODLE_ICS_URL (un lien par ligne), GIST_ID, GIST_TOKEN (clé limitée aux gists).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les calendriers et les déposer dans le gist
        env:
          ICS_URLS: ${{ secrets.MOODLE_ICS_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ICS_URLS}" ] || [ -z "${GIST_ID}" ] || [ -z "${GIST_TOKEN}" ]; then
            echo "Secrets manquants : MOODLE_ICS_URL, GIST_ID et GIST_TOKEN (voir le README)."
            exit 1
          fi
          : > cours.ics
          n=0
          while IFS= read -r url; do
            url="$(echo "$url" | tr -d '\r' | xargs)"
            [ -z "$url" ] && continue
            n=$((n + 1))
            if ! curl -fsSL --max-time 60 "$url" >> cours.ics; then
              echo "Le lien n°$n ne répond pas (lien expiré ou Moodle indisponible)."
              exit 1
            fi
            echo >> cours.ics
          done <<< "${ICS_URLS}"
          if ! grep -q "BEGIN:VCALENDAR" cours.ics; then
            echo "Le contenu reçu n'est pas un calendrier : vérifie le lien d'export Moodle."
            exit 1
          fi
          jq -n --rawfile c cours.ics '{files: {"cours.ics": {content: $c}}}' > body.json
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" --data @body.json > /dev/null
          echo "$(grep -c 'BEGIN:VEVENT' cours.ics) événements envoyés dans le gist."
