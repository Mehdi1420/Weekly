name: Quality

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test